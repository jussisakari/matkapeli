<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Matkapeli</title>
  <meta name="apple-mobile-web-app-title" content="Matkapeli">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#4fb3f6">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="game" width="320" height="180"></canvas>

  <div id="rotate-hint">
    <div class="rotate-icon">📱↻</div>
    <div>Käännä tabletti</div>
  </div>

  <!-- Classic scripts (not modules) so the game works from file:// -->
  <script src="js/sprites.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/lib/three.min.js"></script>
  <script src="js/world3d.js"></script>
  <script src="js/country3d.js"></script>
  <script src="js/player.js"></script>
  <script src="js/pet.js"></script>
  <script src="js/seasons.js"></script>
  <script src="js/photos.js"></script>
  <script src="js/passport.js"></script>
  <script src="js/tvshow.js"></script>
  <script src="js/maskedsinger.js"></script>
  <script src="js/tvchannels.js"></script>
  <script src="js/scenes/start.js"></script>
  <script src="js/scenes/home.js"></script>
  <script src="js/scenes/brush.js"></script>
  <script src="js/scenes/hairbrush.js"></script>
  <script src="js/scenes/wardrobe.js"></script>
  <script src="js/scenes/breakfast.js"></script>

  <script src="js/scenes/memory.js"></script>
  <script src="js/scenes/drums.js"></script>
  <script src="js/scenes/pettricks.js"></script>
  <script src="js/scenes/books.js"></script>
  <script src="js/scenes/album.js"></script>
  <script src="js/scenes/passport.js"></script>
  <script src="js/scenes/concert.js"></script>
  <script src="js/scenes/street.js"></script>
  <script src="js/scenes/airport.js"></script>
  <script src="js/scenes/flight.js"></script>
  <script src="js/scenes/egypt.js"></script>
  <script src="js/scenes/winter.js"></script>
  <script src="js/scenes/igloo.js"></script>
  <script src="js/scenes/thailand.js"></script>
  <script src="js/scenes/temple.js"></script>
  <script src="js/scenes/themepark.js"></script>
  <script src="js/scenes/newyork.js"></script>
  <script src="js/scenes/grandparents.js"></script>
  <script src="js/scenes/sleepover.js"></script>

  <script src="js/scenes/helsinki.js"></script>
  <script src="js/scenes/school.js"></script>
  <script src="js/scenes/drive.js"></script>
  <script src="js/scenes/pyramid.js"></script>
  <script src="js/scenes/labyrinth.js"></script>
  <script src="js/scenes/gallery.js"></script>
  <!-- New countries (made with country3d.js) come after everything else -->
  <script src="js/scenes/australia.js"></script>
  <script src="js/scenes/japan.js"></script>
  <script src="js/scenes/belgium.js"></script>
  <script src="js/scenes/china.js"></script>
  <script src="js/scenes/france.js"></script>
  <script src="js/main.js"></script>
  <script>
    // Installable app + offline play (not available from file://, and that's fine)
    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    }
  </script>

</html>
