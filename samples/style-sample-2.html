<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tyylivertailu 2</title>
<style>
  html, body { margin: 0; height: 100%; background: #1a1a2e; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<script>
// Comparison: round "cute" people (left) vs. older-looking people (right).
// The room is the same on both sides.
const view = document.getElementById('view');
const ctx = view.getContext('2d');
const LW = 660, LH = 312;
let scale = 1, dpr = 1;

function resize() {
  dpr = window.devicePixelRatio || 1;
  scale = Math.min(innerWidth / LW, innerHeight / LH);
  view.style.width = LW * scale + 'px';
  view.style.height = LH * scale + 'px';
  view.width = Math.round(LW * scale * dpr);
  view.height = Math.round(LH * scale * dpr);
}
addEventListener('resize', resize);
resize();

const FONT = '"Comic Sans MS", "Chalkboard SE", "Trebuchet MS", sans-serif';
const OUT = '#2b2340';
const SKIN = '#f6cfa8';
const SKIN_SHADE = '#e2ad86';

function rr(c, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}
function fs(c, fill) { c.fillStyle = fill; c.fill(); c.stroke(); }
function circle(c, x, y, r) { c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); }
function ellipse(c, x, y, rx, ry) { c.beginPath(); c.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); }

// --- Spider costume helpers ---
// Spider web: lines from the middle + sagging rings
function web(c, cx, cy, r, color, lw) {
  c.save(); c.strokeStyle = color; c.lineWidth = lw;
  const n = 10;
  c.beginPath();
  for (let i = 0; i < n; i++) {
    const a = i / n * Math.PI * 2;
    c.moveTo(cx, cy); c.lineTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r);
  }
  for (const k of [0.3, 0.55, 0.8, 1.05]) {
    for (let i = 0; i < n; i++) {
      const a1 = i / n * Math.PI * 2, a2 = (i + 1) / n * Math.PI * 2, am = (a1 + a2) / 2;
      c.moveTo(cx + Math.cos(a1) * r * k, cy + Math.sin(a1) * r * k);
      c.quadraticCurveTo(cx + Math.cos(am) * r * k * 0.85, cy + Math.sin(am) * r * k * 0.85,
                         cx + Math.cos(a2) * r * k, cy + Math.sin(a2) * r * k);
    }
  }
  c.stroke(); c.restore();
}
// Small black spider for the chest
function spiderEmblem(c, x, y, s) {
  c.save(); c.translate(x, y); c.scale(s, s);
  c.fillStyle = '#1a1a2e'; c.strokeStyle = '#1a1a2e'; c.lineWidth = 0.35;
  ellipse(c, 0, 0.2, 0.6, 0.9); c.fill();
  circle(c, 0, -0.9, 0.45); c.fill();
  c.beginPath();
  for (const sd of [-1, 1]) {
    c.moveTo(0, -0.3); c.lineTo(sd * 1.6, -1.5);
    c.moveTo(0, 0); c.lineTo(sd * 1.8, -0.3);
    c.moveTo(0, 0.2); c.lineTo(sd * 1.7, 1.0);
    c.moveTo(0, 0.4); c.lineTo(sd * 1.3, 1.9);
  }
  c.stroke(); c.restore();
}
// Mask: red head, web lines, big white eyes
function spiderMask(c, cx, cy, rx, ry, eyeX, eyeY, ew, eh, lw) {
  c.save();
  ellipse(c, cx, cy, rx, ry); c.fillStyle = SUIT.shirt; c.fill();
  c.save(); ellipse(c, cx, cy, rx, ry); c.clip();
  web(c, cx, cy + ry * 0.15, Math.max(rx, ry) * 1.25, '#7a1418', lw * 0.55);
  c.restore();
  ellipse(c, cx, cy, rx, ry); c.lineWidth = lw; c.strokeStyle = OUT; c.stroke();
  for (const sd of [-1, 1]) {
    c.beginPath(); c.ellipse(cx + sd * eyeX, eyeY, ew, eh, -sd * 0.55, 0, Math.PI * 2);
    c.fillStyle = '#ffffff'; c.fill(); c.lineWidth = lw * 1.3; c.stroke();
  }
  c.restore();
}

// ===========================================================================
// STYLE A: round and cute (same as the first sample)
// ===========================================================================
function personRound(c, o) {
  const sw = o.walking ? Math.sin(o.t * 11) : 0;
  const bob = o.walking ? -Math.abs(Math.sin(o.t * 11)) * 0.8 : 0;
  c.save();
  c.translate(0, bob);
  c.lineWidth = 0.7; c.lineJoin = 'round'; c.lineCap = 'round'; c.strokeStyle = OUT;
  if (o.char === 'girl' && !o.suit) { rr(c, -8.3, -37, 16.6, 22, 6); fs(c, o.hair); }
  for (const side of [-1, 1]) {
    c.save(); c.translate(side * 2.4, -12.5); c.rotate(side * sw * 0.35);
    rr(c, -1.8, 0, 3.6, 11, 1.7); fs(c, o.skirt ? SKIN : o.pants);
    ellipse(c, 0.9, 11.3, 2.9, 1.7); fs(c, o.shoes || '#6b3e26');
    c.restore();
  }
  if (o.skirt) {
    c.beginPath(); c.moveTo(-5, -14); c.lineTo(5, -14); c.lineTo(7.5, -6.5);
    c.quadraticCurveTo(0, -5, -7.5, -6.5); c.closePath(); fs(c, o.pants);
  } else { rr(c, -5, -14.5, 10, 5, 1.8); fs(c, o.pants); }
  for (const side of [-1, 1]) {
    c.save(); c.translate(side * 5.6, -21.5); c.rotate(side * 0.18 - side * sw * 0.45);
    rr(c, -1.7, 0, 3.4, 8.5, 1.7); fs(c, o.shirt);
    circle(c, 0, 9.4, 1.8); fs(c, o.suit ? o.shirt : SKIN);
    c.restore();
  }
  rr(c, -6, -23.5, 12, 11, 3.5); fs(c, o.shirt);
  if (o.stripe) {
    c.save(); rr(c, -6, -23.5, 12, 11, 3.5); c.clip();
    c.fillStyle = o.stripe;
    for (let yy = -22; yy < -12; yy += 2.6) c.fillRect(-7, yy, 14, 1.2);
    c.restore(); rr(c, -6, -23.5, 12, 11, 3.5); c.stroke();
  }
  if (o.suit) {
    c.save(); rr(c, -6, -23.5, 12, 11, 3.5); c.clip();
    web(c, 0, -18.5, 9, '#7a1418', 0.35);
    c.restore();
    rr(c, -6, -23.5, 12, 11, 3.5); c.stroke();
    spiderEmblem(c, 0, -19.5, 1.1);
    spiderMask(c, 0, -30.5, 7.6, 7.6, 3, -31, 2, 1.3, 0.7);
    c.restore();
    return;
  }
  circle(c, 0, -30.5, 7.6); fs(c, SKIN);
  c.fillStyle = OUT;
  ellipse(c, -2.7, -30, 0.95, 1.35); c.fill(); ellipse(c, 2.7, -30, 0.95, 1.35); c.fill();
  c.fillStyle = '#fff'; circle(c, -2.4, -30.5, 0.35); c.fill(); circle(c, 3.0, -30.5, 0.35); c.fill();
  c.fillStyle = 'rgba(240,120,130,0.55)'; circle(c, -4.6, -27.6, 1.4); c.fill(); circle(c, 4.6, -27.6, 1.4); c.fill();
  c.beginPath(); c.arc(0, -28, 1.9, 0.2 * Math.PI, 0.8 * Math.PI); c.stroke();
  c.beginPath();
  if (o.char === 'girl') {
    c.moveTo(-8.1, -29); c.quadraticCurveTo(-8.4, -39.5, 0, -39.3); c.quadraticCurveTo(8.4, -39.5, 8.1, -29);
    c.quadraticCurveTo(6.5, -31.5, 4.3, -32.8); c.quadraticCurveTo(2.2, -31, 0.2, -33.2);
    c.quadraticCurveTo(-2.4, -31, -4.6, -32.8); c.quadraticCurveTo(-6.6, -31.5, -8.1, -29);
  } else {
    c.moveTo(-7.9, -30); c.quadraticCurveTo(-8.2, -39.5, 0, -39.5); c.quadraticCurveTo(2, -41.5, 3.2, -40.6);
    c.quadraticCurveTo(8.3, -38.5, 7.9, -30); c.quadraticCurveTo(5.5, -33.8, 2, -33.6);
    c.quadraticCurveTo(-1.5, -35, -4, -33.6); c.quadraticCurveTo(-6.6, -33, -7.9, -30);
  }
  c.closePath(); fs(c, o.hair);
  if (o.char === 'girl' && !o.hat) {
    c.save(); c.translate(5.6, -37.2);
    c.beginPath(); c.moveTo(0, 0); c.lineTo(3, -2.2); c.lineTo(3, 2.2); c.closePath(); fs(c, '#ff8fc0');
    c.beginPath(); c.moveTo(0, 0); c.lineTo(-3, -2.2); c.lineTo(-3, 2.2); c.closePath(); fs(c, '#ff8fc0');
    circle(c, 0, 0, 1.1); fs(c, '#ff6fae'); c.restore();
  }
  if (o.hat === 'cap') {
    rr(c, 0, -34.2, 12, 2.6, 1.3); fs(c, o.hatShade);
    c.beginPath(); c.arc(0, -33.6, 8.2, Math.PI, 2 * Math.PI); c.closePath(); fs(c, o.hatColor);
    circle(c, 0, -41.6, 0.9); fs(c, o.hatShade);
  }
  c.restore();
}

// ===========================================================================
// STYLE B: older-looking kid. Head is ~1/5 of the height, real neck,
// shoulders, knees and elbows, smaller face details.
// Feet at (0, 0), about 47 units tall.
// ===========================================================================
function darker(hex, k) {
  const n = parseInt(hex.slice(1), 16);
  const r = Math.round(((n >> 16) & 255) * k), g = Math.round(((n >> 8) & 255) * k), b = Math.round((n & 255) * k);
  return 'rgb(' + r + ',' + g + ',' + b + ')';
}

function personOlder(c, o) {
  const sw = o.walking ? Math.sin(o.t * 8) : 0;
  const bob = o.walking ? -Math.abs(Math.cos(o.t * 8)) * 0.6 : 0;
  const hairDark = darker(o.hair, 0.72);
  const shirtShade = darker(o.shirt, 0.82);
  const pantsShade = darker(o.pants, 0.8);
  const shortSleeves = !o.longSleeves;

  c.save();
  c.translate(0, bob);
  c.lineWidth = 0.5; c.lineJoin = 'round'; c.lineCap = 'round'; c.strokeStyle = OUT;

  // The head and hair are drawn 12 % bigger, scaled around the neck.
  const headOn = () => { c.save(); c.translate(0, -37); c.scale(1.12, 1.12); c.translate(0, 37); };

  // --- Hair behind the head (girl: shoulder length) ---
  if (o.char === 'girl' && !o.suit) {
    headOn();
    c.beginPath();
    c.moveTo(-4.8, -41);
    c.quadraticCurveTo(-6.4, -36.5, -5.9, -32.2);
    c.quadraticCurveTo(-4.9, -31.2, -3.8, -32.4);
    c.lineTo(3.8, -32.4);
    c.quadraticCurveTo(4.9, -31.2, 5.9, -32.2);
    c.quadraticCurveTo(6.4, -36.5, 4.8, -41);
    c.quadraticCurveTo(4.9, -47.4, 0, -47.4);
    c.quadraticCurveTo(-4.9, -47.4, -4.8, -41);
    c.closePath(); fs(c, o.hair);
    c.strokeStyle = hairDark;
    c.beginPath(); c.moveTo(-5.2, -38); c.quadraticCurveTo(-5.4, -35, -4.9, -32.8);
    c.moveTo(5.2, -38); c.quadraticCurveTo(5.4, -35, 4.9, -32.8); c.stroke();
    c.strokeStyle = OUT;
    c.restore();
  }

  // --- Legs: thigh + shin, knee bends when the leg is behind ---
  for (const side of [-1, 1]) {
    const a1 = side * sw * 0.22;
    const a2 = Math.max(0, -side * sw) * 0.25;
    const legColor = o.skirt ? SKIN : o.pants;
    c.save();
    c.translate(side * 2.1, -21);
    c.rotate(a1);
    rr(c, -1.95, -0.5, 3.9, 10.8, 1.8); fs(c, legColor);
    c.translate(0, 9.8);
    c.rotate(a2);
    rr(c, -1.7, -0.4, 3.4, 9.9, 1.6); fs(c, o.skirt ? SKIN : legColor);
    if (o.skirt) { rr(c, -1.6, 6.8, 3.2, 2.6, 0.8); fs(c, '#ffffff'); } // socks
    // Sneaker
    c.translate(0, 9.3);
    rr(c, -1.8, -0.6, 4.6, 2.3, 1.1); fs(c, o.shoes || '#3d4a6b');
    rr(c, -1.8, 1.0, 4.6, 0.85, 0.4); fs(c, '#ffffff');
    c.restore();
  }

  // --- Hips: pants or skirt ---
  if (o.skirt) {
    c.beginPath();
    c.moveTo(-4.3, -21.8); c.lineTo(4.3, -21.8); c.lineTo(6.4, -13.6);
    c.quadraticCurveTo(0, -12.5, -6.4, -13.6); c.closePath(); fs(c, o.pants);
    c.strokeStyle = pantsShade;
    c.beginPath(); c.moveTo(-1.6, -20.5); c.lineTo(-2.4, -13.4); c.moveTo(1.6, -20.5); c.lineTo(2.4, -13.4); c.stroke();
    c.strokeStyle = OUT;
  } else {
    rr(c, -4.3, -22.5, 8.6, 4.5, 1.4); fs(c, o.pants);
  }

  // --- Neck ---
  rr(c, -1.25, -38, 2.5, 4.2, 0.7); fs(c, o.suit ? darker(o.shirt, 0.85) : SKIN_SHADE);

  // --- Torso: shoulders wider than the waist ---
  const torso = () => {
    c.beginPath();
    c.moveTo(-3.2, -34.7); c.lineTo(3.2, -34.7);
    c.quadraticCurveTo(5.3, -34.5, 5.4, -32.2);
    c.lineTo(4.5, -20.2);
    c.quadraticCurveTo(0, -19.5, -4.5, -20.2);
    c.lineTo(-5.4, -32.2);
    c.quadraticCurveTo(-5.3, -34.5, -3.2, -34.7);
    c.closePath();
  };
  torso(); fs(c, o.shirt);
  c.save(); torso(); c.clip();
  if (o.stripe) {
    c.fillStyle = o.stripe;
    for (let yy = -33.5; yy < -20; yy += 2.3) c.fillRect(-6, yy, 12, 1.05);
  }
  if (o.suit) web(c, 0, -29.5, 10, '#7a1418', 0.25);
  c.fillStyle = 'rgba(0,0,0,0.08)'; c.fillRect(2.2, -36, 4, 17);   // shadow on one side
  c.restore();
  torso(); c.stroke();
  if (o.suit) {
    spiderEmblem(c, 0, -30, 0.85);
  } else {
    // Collar
    c.fillStyle = SKIN_SHADE;
    c.beginPath(); c.ellipse(0, -34.7, 1.7, 1.15, 0, 0, Math.PI); c.fill();
    c.beginPath(); c.ellipse(0, -34.7, 1.7, 1.15, 0, 0, Math.PI); c.stroke();
  }

  // --- Arms: upper arm + forearm, swing opposite to the legs ---
  for (const side of [-1, 1]) {
    c.save();
    c.translate(side * 4.6, -33.6);
    c.rotate(-side * 0.12 + side * sw * 0.3);
    rr(c, -1.3, -0.3, 2.6, 7.3, 1.3); fs(c, shortSleeves ? SKIN : o.shirt);
    if (shortSleeves) { rr(c, -1.55, -0.6, 3.1, 4.2, 1.3); fs(c, o.shirt); }
    c.translate(0, 6.7);
    c.rotate(side * 0.06);
    rr(c, -1.15, -0.3, 2.3, 6.4, 1.1); fs(c, o.longSleeves ? o.shirt : SKIN);
    ellipse(c, 0, 6.8, 1.2, 1.5); fs(c, o.suit ? o.shirt : SKIN);
    c.restore();
  }

  // --- Head ---
  headOn();
  ellipse(c, -4.3, -40.8, 0.75, 1.15); fs(c, SKIN);   // ears
  ellipse(c, 4.3, -40.8, 0.75, 1.15); fs(c, SKIN);
  ellipse(c, 0, -41.3, 4.4, 5.1); fs(c, SKIN);
  if (o.suit) {
    spiderMask(c, 0, -41.3, 4.6, 5.3, 1.75, -41.7, 1.3, 0.8, 0.5);
    c.restore(); // head scale
    c.restore();
    return;
  }

  // Face
  c.fillStyle = OUT;
  ellipse(c, -1.65, -41.1, 0.55, 0.8); c.fill();
  ellipse(c, 1.65, -41.1, 0.55, 0.8); c.fill();
  c.fillStyle = '#fff';
  circle(c, -1.5, -41.4, 0.2); c.fill();
  circle(c, 1.8, -41.4, 0.2); c.fill();
  c.strokeStyle = hairDark; c.lineWidth = 0.42;
  c.beginPath();
  c.moveTo(-2.5, -42.7); c.quadraticCurveTo(-1.7, -43.3, -0.9, -42.9);
  c.moveTo(0.9, -42.9); c.quadraticCurveTo(1.7, -43.3, 2.5, -42.7);
  c.stroke();
  c.strokeStyle = SKIN_SHADE; c.lineWidth = 0.45;
  c.beginPath(); c.moveTo(0.15, -40.5); c.quadraticCurveTo(0.7, -39.5, 0, -39.3); c.stroke();
  c.strokeStyle = '#a0524a'; c.lineWidth = 0.42;
  c.beginPath(); c.arc(0, -38.9, 1.05, 0.22 * Math.PI, 0.78 * Math.PI); c.stroke();
  c.fillStyle = 'rgba(230,120,120,0.22)';
  circle(c, -2.7, -39.7, 0.9); c.fill();
  circle(c, 2.7, -39.7, 0.9); c.fill();
  c.strokeStyle = OUT; c.lineWidth = 0.5;

  // --- Hair on top ---
  c.beginPath();
  if (o.char === 'girl') {
    // Side parting, fringe sweeping to one side
    c.moveTo(-4.7, -40.3);
    c.quadraticCurveTo(-5.3, -47, 0, -47.1);
    c.quadraticCurveTo(5.3, -47, 4.7, -40.3);
    c.quadraticCurveTo(4.4, -43.2, 2.6, -44.3);
    c.quadraticCurveTo(-0.6, -42.4, -3.6, -43.4);
    c.quadraticCurveTo(-4.5, -42.6, -4.7, -40.3);
  } else {
    // Short hair with a little flick
    c.moveTo(-4.6, -40.6);
    c.quadraticCurveTo(-5.1, -47.1, 0.2, -47.3);
    c.quadraticCurveTo(2.2, -48.6, 3.6, -47.4);
    c.quadraticCurveTo(5.4, -46.2, 4.6, -40.6);
    c.quadraticCurveTo(4.3, -43.6, 2.8, -44.2);
    c.quadraticCurveTo(0.2, -43.1, -2.4, -44.3);
    c.quadraticCurveTo(-4, -43.6, -4.6, -40.6);
  }
  c.closePath(); fs(c, o.hair);
  c.strokeStyle = hairDark;
  c.beginPath();
  if (o.char === 'girl') { c.moveTo(-1.5, -46.6); c.quadraticCurveTo(0.5, -45.5, 2.6, -44.6); }
  else { c.moveTo(-1.2, -46.6); c.quadraticCurveTo(0.6, -45.6, 1.8, -44.4); }
  c.stroke();
  c.strokeStyle = OUT;

  // Hair clip (girl, no hat)
  if (o.char === 'girl' && !o.hat) {
    c.save(); c.translate(-3.1, -44.6); c.rotate(-0.5);
    rr(c, -1.3, -0.45, 2.6, 0.9, 0.45); fs(c, '#ff8fc0');
    c.restore();
  }
  // Cap
  if (o.hat === 'cap') {
    rr(c, 0.5, -44.4, 7.6, 1.6, 0.8); fs(c, o.hatShade);
    c.beginPath(); c.arc(0, -43.9, 4.95, Math.PI, 2 * Math.PI); c.closePath(); fs(c, o.hatColor);
    c.strokeStyle = o.hatShade;
    c.beginPath(); c.moveTo(0, -48.8); c.lineTo(0, -44.3); c.stroke();
    c.strokeStyle = OUT;
    circle(c, 0, -48.9, 0.6); fs(c, o.hatShade);
  }
  c.restore(); // head scale
  c.restore();
}

// ===========================================================================
// The room (same on both sides)
// ===========================================================================
function drawRoom(c, t, personFn, ps) {
  c.lineJoin = 'round'; c.lineCap = 'round'; c.strokeStyle = OUT; c.lineWidth = 0.8;
  c.fillStyle = '#fbe3c8'; c.fillRect(0, 0, 320, 180);
  c.fillStyle = 'rgba(230,170,130,0.35)';
  for (let yy = 8; yy < 150; yy += 14) for (let xx = (yy / 14 % 2) * 7 + 4; xx < 320; xx += 14) { circle(c, xx, yy, 1.1); c.fill(); }
  c.fillStyle = '#d9a877'; c.fillRect(0, 150, 320, 30);
  c.strokeStyle = 'rgba(120,70,40,0.35)'; c.lineWidth = 0.6;
  for (let yy = 156; yy < 180; yy += 7) { c.beginPath(); c.moveTo(0, yy); c.lineTo(320, yy); c.stroke(); }
  c.strokeStyle = OUT; c.lineWidth = 0.8;
  c.beginPath(); c.moveTo(0, 150); c.lineTo(320, 150); c.stroke();

  // Window
  rr(c, 28, 38, 30, 26, 3); fs(c, '#c98a55');
  const sky = c.createLinearGradient(0, 41, 0, 61);
  sky.addColorStop(0, '#6cc0ff'); sky.addColorStop(1, '#cdeeff');
  rr(c, 31, 41, 24, 20, 1.5); fs(c, sky);
  c.save(); rr(c, 31, 41, 24, 20, 1.5); c.clip();
  c.fillStyle = '#ffd23f'; circle(c, 47, 49, 4.5); c.fill();
  c.strokeStyle = '#ffb000'; c.lineWidth = 0.8;
  for (let i = 0; i < 8; i++) {
    const a = i * Math.PI / 4 + t * 0.5;
    c.beginPath(); c.moveTo(47 + Math.cos(a) * 6, 49 + Math.sin(a) * 6); c.lineTo(47 + Math.cos(a) * 8, 49 + Math.sin(a) * 8); c.stroke();
  }
  c.fillStyle = '#fff'; ellipse(c, 37, 55, 4, 1.8); c.fill(); ellipse(c, 40, 54, 3, 2); c.fill();
  c.restore();
  c.beginPath(); c.moveTo(43, 41); c.lineTo(43, 61); c.moveTo(31, 51); c.lineTo(55, 51);
  c.lineWidth = 1.6; c.strokeStyle = '#c98a55'; c.stroke();
  c.lineWidth = 0.8; c.strokeStyle = OUT;
  rr(c, 26, 63, 34, 3, 1.5); fs(c, '#a0643c');

  // Bed
  rr(c, 14, 122, 5, 29, 2); fs(c, '#a0643c');
  rr(c, 56, 133, 4, 18, 2); fs(c, '#a0643c');
  rr(c, 18, 137, 40, 8, 2); fs(c, '#fff');
  rr(c, 20, 132, 12, 6, 3); fs(c, '#fff');
  rr(c, 28, 134, 30, 9, 3); fs(c, '#4a78c8');
  c.fillStyle = '#9fc8ff';
  for (let xx = 32; xx < 56; xx += 5) { circle(c, xx, 138.5, 0.9); c.fill(); }
  rr(c, 17, 144, 41, 4, 1.5); fs(c, '#6e4226');

  // Teddy
  c.save(); c.translate(66, 150);
  circle(c, -3, -12, 1.8); fs(c, '#a0643c'); circle(c, 3, -12, 1.8); fs(c, '#a0643c');
  ellipse(c, 0, -4, 4.5, 4.2); fs(c, '#a0643c');
  circle(c, 0, -10, 3.8); fs(c, '#a0643c');
  ellipse(c, 0, -9, 1.8, 1.3); fs(c, '#d9a877');
  c.fillStyle = OUT; circle(c, -1.4, -11, 0.5); c.fill(); circle(c, 1.4, -11, 0.5); c.fill(); circle(c, 0, -9.4, 0.5); c.fill();
  c.restore();

  // Panda
  c.save(); c.translate(79, 150);
  const BLACK = '#2b2b33', WHITE = '#fbfbfb';
  circle(c, -3.2, -12.6, 1.7); fs(c, BLACK); circle(c, 3.2, -12.6, 1.7); fs(c, BLACK);   // ears
  ellipse(c, -3, -1.2, 2, 1.5); fs(c, BLACK); ellipse(c, 3, -1.2, 2, 1.5); fs(c, BLACK); // feet
  ellipse(c, 0, -4.5, 4.6, 4.3); fs(c, WHITE);                                         // body
  ellipse(c, -4, -5.2, 1.4, 2.4); fs(c, BLACK); ellipse(c, 4, -5.2, 1.4, 2.4); fs(c, BLACK); // arms
  ellipse(c, 0, -10.2, 4.1, 3.7); fs(c, WHITE);                                        // head
  c.fillStyle = BLACK;
  c.beginPath(); c.ellipse(-1.6, -10.6, 1.05, 1.4, 0.5, 0, Math.PI * 2); c.fill();        // eye patches
  c.beginPath(); c.ellipse(1.6, -10.6, 1.05, 1.4, -0.5, 0, Math.PI * 2); c.fill();
  c.fillStyle = WHITE; circle(c, -1.4, -10.9, 0.35); c.fill(); circle(c, 1.4, -10.9, 0.35); c.fill();
  c.fillStyle = BLACK; ellipse(c, 0, -8.9, 0.6, 0.4); c.fill();                          // nose
  c.restore();

  // Mirror + sink
  ellipse(c, 153, 104, 8, 10); fs(c, '#ffd23f');
  ellipse(c, 153, 104, 6, 8); fs(c, '#bfe6ff');
  c.strokeStyle = '#fff'; c.lineWidth = 1;
  c.beginPath(); c.moveTo(150, 99); c.lineTo(152, 97); c.moveTo(150, 103); c.lineTo(155, 98); c.stroke();
  c.strokeStyle = OUT; c.lineWidth = 0.8;
  rr(c, 150, 128, 6, 23, 2); fs(c, '#eef2f8');
  c.beginPath(); c.moveTo(142, 126); c.lineTo(164, 126); c.quadraticCurveTo(163, 134, 153, 134); c.quadraticCurveTo(143, 134, 142, 126); c.closePath(); fs(c, '#fff');
  c.beginPath(); c.moveTo(153, 126); c.lineTo(153, 120); c.quadraticCurveTo(153, 118.5, 156, 118.5); c.lineTo(158, 118.5);
  c.lineWidth = 1.8; c.strokeStyle = '#8a93a6'; c.stroke(); c.lineWidth = 0.8; c.strokeStyle = OUT;
  c.beginPath(); c.moveTo(145, 117); c.lineTo(146, 112); c.lineWidth = 1; c.strokeStyle = '#ff8fc0'; c.stroke(); c.lineWidth = 0.8; c.strokeStyle = OUT;
  rr(c, 143, 117, 4.5, 9, 1); fs(c, '#4a78c8');

  // Wardrobe
  rr(c, 260, 98, 32, 53, 2.5); fs(c, '#a0643c');
  rr(c, 263, 101, 12.5, 46, 1.5); fs(c, '#c98a55');
  rr(c, 276.5, 101, 12.5, 46, 1.5); fs(c, '#c98a55');
  circle(c, 273, 124, 1); fs(c, '#ffd23f'); circle(c, 278.5, 124, 1); fs(c, '#ffd23f');
  rr(c, 258, 95, 36, 4, 2); fs(c, '#6e4226');

  // People
  const people = [
    [100, PEOPLE[0]], [200, PEOPLE[1]], [228, PEOPLE[2]],
  ];
  for (const [x, o] of people) {
    c.save(); c.translate(x, 150); c.scale(ps, ps);
    personFn(c, Object.assign({ t }, o));
    c.restore();
  }

  // Speech bubble
  const text = ['Huomenta! Mennään', 'pesemään hampaat.'];
  c.font = 'bold 7.5px ' + FONT;
  const w = Math.max(...text.map((s) => c.measureText(s).width)) + 12, h = 24;
  const bx = 100 - w / 2, by = 100 - h;
  c.lineWidth = 0.8; c.strokeStyle = OUT;
  c.beginPath();
  c.moveTo(bx + 6, by); c.arcTo(bx + w, by, bx + w, by + h, 6); c.arcTo(bx + w, by + h, bx, by + h, 6);
  c.lineTo(104, by + h); c.lineTo(100, by + h + 6); c.lineTo(96, by + h);
  c.arcTo(bx, by + h, bx, by, 6); c.arcTo(bx, by, bx + w, by, 6); c.closePath();
  fs(c, '#fff');
  c.fillStyle = OUT; c.textAlign = 'center'; c.textBaseline = 'middle';
  c.fillText(text[0], 100, by + 8); c.fillText(text[1], 100, by + 17);
}

const PEOPLE = [
  { char: 'girl', walking: true, hair: '#8b4a2b', shirt: '#9fc8ff', stripe: '#e6f2ff', pants: '#9fc8ff', longSleeves: true, shoes: '#6f9fe0' },
  { char: 'girl', hair: '#8b4a2b', shirt: '#e04848', pants: '#3f6fb5', hat: 'cap', hatColor: '#e04848', hatShade: '#a83232' },
  { char: 'boy', hair: '#e3b04b', shirt: '#4caf50', pants: '#8b5a2b', shoes: '#5a3a2a' },
];
const EXTRA = { char: 'girl', walking: true, hair: '#8b4a2b', shirt: '#ffd23f', pants: '#9b6bd6', skirt: true };
// Spider costume: a whole outfit (red top, blue legs, red boots and gloves, mask)
const SUIT = { char: 'boy', suit: true, walking: true, hair: '#000000', shirt: '#d62828', pants: '#2b4fa8', shoes: '#d62828', longSleeves: true };

// ===========================================================================
function frame(now) {
  const t = now / 1000;
  const k = scale * dpr;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#1a1a2e';
  ctx.fillRect(0, 0, view.width, view.height);

  ctx.setTransform(k, 0, 0, k, 0, 0);
  ctx.fillStyle = '#ffe680';
  ctx.font = 'bold 13px ' + FONT;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('A. Pyöreä (edellinen)', 160, 13);
  ctx.fillText('B. Isompi lapsi (uusi)', 500, 13);

  const panels = [[0, personRound, 1, 2.0], [340, personOlder, 0.88, 1.75]];
  for (const [px, fn, ps, closeScale] of panels) {
    // Room
    ctx.save();
    ctx.setTransform(k, 0, 0, k, px * k, 26 * k);
    ctx.beginPath(); ctx.rect(0, 0, 320, 180); ctx.clip();
    drawRoom(ctx, t, fn, ps);
    ctx.restore();

    // Close-ups (4 people)
    ctx.setTransform(k, 0, 0, k, 0, 0);
    ctx.fillStyle = '#fbe3c8';
    ctx.fillRect(px, 214, 320, 96);
    const list = [PEOPLE[0], PEOPLE[1], PEOPLE[2], EXTRA, SUIT];
    list.forEach((o, i) => {
      ctx.setTransform(k * closeScale, 0, 0, k * closeScale, (px + 34 + i * 63) * k, 306 * k);
      fn(ctx, Object.assign({ t }, o));
    });
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
